version: "2"
output:
  formats:
    text:
      path: stderr
      colors: false
    html:
      path: ./build/lint-report.html
    checkstyle:
      path: ./build/lint-report-checkstyle.xml
linters:
  default: none
  enable:
    - prealloc
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
